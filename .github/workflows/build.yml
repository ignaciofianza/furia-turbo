name: Build Furia Turbo

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: furia-turbo-windows
            executable_name: "Furia Turbo.exe"

          - os: macos-latest
            artifact_name: furia-turbo-macos
            executable_name: "Furia Turbo.app"

          - os: ubuntu-latest
            artifact_name: furia-turbo-linux
            executable_name: "furia-turbo"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # =========================================================
      # WINDOWS
      # =========================================================

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Furia Turbo" `
            --icon "assets/imagenes/icon.ico" `
            --add-data "assets;assets" `
            main.py

      # =========================================================
      # MACOS
      # =========================================================

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Furia Turbo" \
            --icon "assets/imagenes/icon.icns" \
            --add-data "assets:assets" \
            main.py

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "Furia Turbo.app" \
            "Furia-Turbo-macOS.zip"

      # =========================================================
      # LINUX
      # =========================================================

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libasound2-dev \
            libpulse-dev

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name "furia-turbo" \
            --icon "assets/imagenes/icon_1024.png" \
            --add-data "assets:assets" \
            main.py

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf Furia-Turbo-Linux.tar.gz furia-turbo

      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: furia-turbo-windows
          path: dist/Furia Turbo.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: furia-turbo-macos
          path: dist/Furia-Turbo-macOS.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: furia-turbo-linux
          path: dist/Furia-Turbo-Linux.tar.gz

      # =========================================================
      # RELEASE
      # =========================================================

      - name: Upload Windows to Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Furia Turbo.exe

      - name: Upload macOS to Release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Furia-Turbo-macOS.zip

      - name: Upload Linux to Release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Furia-Turbo-Linux.tar.gz
